name: Build natives for pane

# One tar.gz (+ .sha256) per platform, kept as artifacts. They go to chromium.nuulm.com/java-cef-builds/<commit>/.
on:
  push:
    branches: [pane]
  workflow_dispatch:

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 libgtk-3-dev
          mkdir jcef_build && cd jcef_build
          cmake -G Ninja -DPROJECT_ARCH=${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release ..
          ninja -j4
          mv native/Release linux_${{ matrix.arch }}
          strip linux_${{ matrix.arch }}/libcef.so
          tar -czf linux_${{ matrix.arch }}.tar.gz linux_${{ matrix.arch }}
          sha256sum linux_${{ matrix.arch }}.tar.gz > linux_${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux_${{ matrix.arch }}
          path: jcef_build/linux_${{ matrix.arch }}.tar.gz*

  windows:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      - shell: bash
        run: |
          mkdir jcef_build && cd jcef_build
          cmake -G Ninja -DPROJECT_ARCH=${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release ..
          ninja -j4
          mv native/Release windows_${{ matrix.arch }}
          tar -czf windows_${{ matrix.arch }}.tar.gz windows_${{ matrix.arch }}
          sha256sum windows_${{ matrix.arch }}.tar.gz > windows_${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows_${{ matrix.arch }}
          path: jcef_build/windows_${{ matrix.arch }}.tar.gz*

  macos:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - run: |
          brew install ninja coreutils ant
          mkdir jcef_build && cd jcef_build
          cmake -G Ninja -DPROJECT_ARCH=${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release ..
          ninja -j4
          mv native/Release macos_${{ matrix.arch }}
          tar -czf macos_${{ matrix.arch }}.tar.gz macos_${{ matrix.arch }}
          sha256sum macos_${{ matrix.arch }}.tar.gz > macos_${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos_${{ matrix.arch }}
          path: jcef_build/macos_${{ matrix.arch }}.tar.gz*
